; /etc/supervisor/conf.d/nc5mail-worker.conf
; Ativar apos setar QUEUE_CONNECTION=database no .env.
; Comandos:
;   sudo cp docs/supervisor.conf /etc/supervisor/conf.d/nc5mail-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start nc5mail-worker:*

[program:nc5mail-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/nc5mail/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/nc5mail-worker.log
stopwaitsecs=3600
